name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev tools
        run: |
          set -euxo pipefail
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[dev]"
          python -c "import app, app.config, app.engine_tick, app.api; print('import-ok', app.config.settings.trading_mode)"

      - name: Compile all modules
        run: python -m compileall -q app tests

      - name: Ruff lint
        run: python -m ruff check app tests

      - name: Pytest
        env:
          TRADING_MODE: paper
          BINANCE_TESTNET: "true"
          STARTING_CASH_USDT: "100"
        run: python -m pytest tests/ -q --tb=short -ra
