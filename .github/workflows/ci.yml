name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q app tests

      - name: Ruff
        run: python -m ruff check app tests

      - name: Pytest
        env:
          TRADING_MODE: paper
          BINANCE_TESTNET: "true"
          NEXORA_SKIP_ENGINE: "1"
          STARTING_CASH_USDT: "100"
        run: python -m pytest tests/ -q --tb=short -ra
